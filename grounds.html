<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grounds</title>
<style>
:root{--bg:#efefef;--card:#fff;--line:#e5e7eb;--soft:#f1f3f5;--ink:#111827;--ink2:#374151;--muted:#6b7280;--bar:#1f1f1f;--accent:#2563eb;--good:#2e7d32;--warn:#a35a00;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
a{color:inherit}
nav.top{background:var(--bar);height:52px;padding:0 30px;display:flex;align-items:center;gap:10px;font-size:14px;color:#d1d5db}
nav.top b{color:#fff}
main{max-width:1180px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:20px}
.sub{margin:6px 0 0;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid #dcdcdc}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 0 12px;min-height:36px;font:inherit;font-size:14px;color:#4b5563;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.sec{margin:6px 0 0;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kpi{padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.kpi .t{font-size:14px;color:var(--ink2)}
.kpi .v{font-size:26px;font-weight:700}
.kpi .g{font-size:14px;color:var(--muted);font-weight:400}
.kpi .n{font-size:12px;line-height:1.45;color:var(--muted)}
figure{margin:0;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
figcaption{font-size:14px;font-weight:700}
.legend{display:flex;gap:18px;font-size:12px;color:#4b5563}
.legend span{display:flex;align-items:center;gap:6px}
.foot{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}
.box{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{white-space:nowrap;padding:7px 10px;text-align:left}
thead th{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
tbody td{border-bottom:1px solid var(--soft)}
.r{text-align:right}.bl{border-left:1px solid var(--line)}
.wrap{white-space:normal;min-width:220px}
.pill{display:inline-flex;flex-direction:column;align-items:center;min-width:92px;padding:4px 6px;border-radius:6px;font-size:11px;line-height:1.3;text-decoration:none}
.pill.sm{min-width:0;padding:3px 8px;flex-direction:row}
.Completed{background:#dcfce7;color:#166534}.Scheduled{background:#dbeafe;color:#1e40af}.Overdue{background:#fee2e2;color:#991b1b}
.Canceled{background:#f3f4f6;color:#4b5563}.Could{background:#ffedd5;color:#9a3412}.Notdue{background:#fafafa;color:var(--muted);border:1px dashed #d1d5db}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid #d1d5db;background:#fff;color:var(--ink2);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;min-height:34px;cursor:pointer}
.chip[aria-pressed=true]{background:#1f2937;color:#fff;border-color:#1f2937}
.person{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:700;background:#e0e7ff;color:#3730a3}
.av.un{background:#fee2e2;color:#991b1b}
.ph h3{margin:0;font-size:15px}.ph small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;background:#dbeafe;color:#1e3a8a}
.ok{margin:0;font-size:13px;color:#166534;background:#f0fdf4;border-radius:6px;padding:10px 12px}
.note{margin:0;font-size:13px;color:#4b5563}
.red{color:#991b1b;font-weight:600}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ctl select,.dt input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:var(--ink)}
.dt{font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:8px;margin-right:14px}
.tree{padding:0;overflow:hidden}.tree thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:#fafafa;padding:10px 14px}
.tree td{padding:9px 14px}.tree .bud{color:var(--muted)}
.tree tr.tot td{font-weight:700;background:#f9fafb;border-bottom:1px solid var(--line)}
.tree tr.l0,.tree tr.l1{cursor:pointer}.tree tr.l0:hover,.tree tr.l1:hover{background:#f5f7ff}
.tree tr.l1 td{background:#f8f9fe}.tree tr.l1 td:first-child{padding-left:38px}
.tree tr.l1 a{text-decoration:underline dotted;text-underline-offset:3px}
.chev{display:inline-block;width:14px;margin-right:6px;font-size:10px;color:var(--muted);transition:transform .15s}.chev.open{transform:rotate(90deg)}
.cnt{margin-left:10px;font-size:11px;color:var(--muted)}
.tree tr.l2>td{padding:0 14px 10px 58px;background:#f8f9fe}
table.inner{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:6px}
table.inner th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;background:#fff}
table.inner td{padding:4px 10px;border-bottom:1px solid var(--soft)}
.bw{height:6px;background:#eceff3;border-radius:3px;overflow:hidden;width:90px;margin-left:auto}.bf{height:100%}
.src{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}
.src.Labor{background:#e0f2fe;color:#0369a1}.src.Ramp{background:#f3e8ff;color:#7e22ce}.src.Vendor{background:#fef3c7;color:#92400e}
.src.Resident,.src.Journal{background:#f3f4f6;color:#4b5563}
@media (max-width:600px){nav.top{padding:0 16px}}
</style>
</head>
<body>
<nav class="top" aria-label="Breadcrumb">Grounds <span aria-hidden="true">/</span> <b id="crumb">Overview</b></nav>
<main>
  <div>
    <h1>Grounds</h1>
    <p class="sub" id="gen">Loading...</p>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</main>
<script>
const TABS = [['overview', 'Overview'], ['status', 'Recurring Status'], ['other', 'Other Recurring'], ['wo', 'Work Orders'], ['tx', 'Transactions']];
const PM = 'https://app.propertymeld.com/2975/m/2975/meld/';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let D = null, tab = (location.hash || '#overview').slice(1), city = 'All';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const signed = n => (n > 0 ? '+' : n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const pct = v => v == null ? 'n/a' : (Math.round(v * 10) / 10) + '%';
const mLabel = (mo, cur) => MON[+mo.slice(5, 7) - 1] + (cur ? '*' : '');
const dLabel = d => MON[+d.slice(5, 7) - 1] + ' ' + (+d.slice(8, 10));
const colorPct = (v, goodHigh = true) => v == null ? 'var(--muted)' : goodHigh ? (v >= 90 ? 'var(--good)' : v >= 75 ? 'var(--warn)' : 'var(--bad)') : 'var(--ink)';
const cls = l => l.replace(/ .*/, '').replace('Not', 'Notdue');
const inCity = x => city === 'All' || x.area === city;

function chart(title, legend, color, pts, goal, max, ticks, foot) {
  const W0 = 70, W1 = 450, H0 = 20, H1 = 190, y = v => H1 - v / max * (H1 - H0);
  const valid = pts.filter(p => p.v != null);
  const xs = i => Math.round(W0 + i * (W1 - W0) / Math.max(1, pts.length - 1));
  const P = pts.map((p, i) => ({ x: xs(i), y: p.v == null ? null : Math.round(y(Math.min(p.v, max))), m: p.m, v: p.v, cur: p.cur }));
  const solid = P.filter(p => p.y != null && !p.cur).map(p => p.x + ',' + p.y).join(' ');
  const lastTwo = P.filter(p => p.y != null).slice(-2);
  const dashed = lastTwo.length === 2 && lastTwo[1].cur ? lastTwo.map(p => p.x + ',' + p.y).join(' ') : '';
  const gy = Math.round(y(goal));
  const aria = title + ': ' + P.map(p => p.m + ' ' + (p.v == null ? 'no data' : p.v + '%')).join(', ');
  return `<figure class="card"><figcaption>${esc(title)}</figcaption>
  <div class="legend"><span><svg width="20" height="4" aria-hidden="true"><line x1="0" y1="2" x2="20" y2="2" stroke="${color}" stroke-width="2"/></svg>${esc(legend)}</span>
  <span><svg width="20" height="4" aria-hidden="true"><line x1="0" y1="2" x2="20" y2="2" stroke="${color}" stroke-width="2" stroke-dasharray="3 3"/></svg>Month to date</span></div>
  <svg viewBox="0 0 480 220" role="img" aria-label="${esc(aria)}" style="width:100%;height:auto;display:block">
  ${ticks.map(t => `<line x1="48" x2="470" y1="${y(t)}" y2="${y(t)}" stroke="#eceff3"/><text x="40" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#6b7280">${t}%</text>`).join('')}
  <line x1="48" x2="470" y1="${gy}" y2="${gy}" stroke="#9ca3af" stroke-dasharray="2 3"/><text x="468" y="${gy - 6}" text-anchor="end" font-size="11" fill="#6b7280">Goal ${goal}%</text>
  <polyline points="${solid}" fill="none" stroke="${color}" stroke-width="2"/>
  ${dashed ? `<polyline points="${dashed}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="5 4"/>` : ''}
  ${P.map(p => (p.y != null ? `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}"><title>${p.m}: ${p.v}%</title></circle>` : '') + `<text x="${p.x}" y="212" text-anchor="middle" font-size="11" fill="#6b7280">${p.m}</text>`).join('')}
  </svg><p class="foot">${foot}</p></figure>`;
}

function overview() {
  const k = D.kpis, q = D.quarter;
  const kpi = (t, v, goal, color, n) => `<div class="card kpi"><div class="t">${t}</div><div class="v" style="color:${color}">${v} <span class="g">/ ${goal}</span></div><div class="n">${n}</div></div>`;
  const ob = Object.entries(k.overdue.byArea).map(([a, n]) => a + ' ' + n).join(', ');
  const util = k.utilization.value;
  let h = `<h2 class="sec">HEADLINE</h2><div class="grid4">
  ${kpi(`Budget utilization, ${q}`, pct(util), '90%', util == null ? 'var(--muted)' : util <= 90 ? 'var(--good)' : util <= 100 ? 'var(--warn)' : 'var(--bad)', `${money(k.utilization.actual)} actual over ${money(k.utilization.budget)} budget to date, all properties (Accrual).`)}
  ${kpi(`Recurring completion rate, ${q}`, pct(k.completion.value), '90%', colorPct(k.completion.value), `${k.completion.completed} of ${k.completion.due} G - melds due this quarter completed (Scheduled counts 0.25). Canceled melds and vendor-billed placeholder series not counted.`)}
  ${kpi('Overdue recurring melds', k.overdue.value, '0', k.overdue.value ? 'var(--bad)' : 'var(--good)', 'Date passed, not completed or canceled.' + (ob ? ' ' + ob + '.' : ''))}
  ${kpi(`Vendor share of spending, ${q}`, pct(k.vendorShare.value), '25%', k.vendorShare.value == null ? 'var(--muted)' : k.vendorShare.value <= 25 ? 'var(--good)' : 'var(--warn)', `${money(k.vendorShare.bills)} of vendor bills over ${money(k.vendorShare.total)} posted to Grounds.`)}
  </div><h2 class="sec">TRENDS</h2><div class="grid2">`;
  const pts = f => D.trend.map(t => ({ m: mLabel(t.month, t.current), v: t[f], cur: t.current }));
  const um = Math.max(120, ...D.trend.map(t => t.utilization || 0));
  const umax = Math.ceil(um / 30) * 30;
  h += chart('Monthly budget utilization', 'Utilization', '#2563eb', pts('utilization'), 90, umax, [0, umax / 4, umax / 2, umax * 3 / 4, umax].map(Math.round), 'AppFolio GL 52003 R&amp;M - Grounds, actual over budget (Accrual), all properties. *Month to date, against the budget for the days so far.');
  h += chart('Recurring completion rate', 'Completion', '#0e7490', pts('completion'), 90, 100, [0, 25, 50, 75, 100], 'G - melds completed over those due in the month (Property Meld). Canceled melds not counted; could-not-complete counts as not done.');
  h += `</div><h2 class="sec">BY PROPERTY</h2><section class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px">
  <h3 style="margin:0;font-size:14px">Budget v. actual, and recurring completion</h3><div class="box"><table><thead><tr><th></th>
  ${D.table_months.map(mo => `<th colspan="3" class="bl" style="text-align:center">${mLabel(mo, mo === D.current_month)}</th>`).join('')}<th colspan="3" class="bl" style="text-align:center">Total</th><th class="bl r">Recurring</th></tr>
  <tr><th>Property</th>${'<th class="r bl">Budget</th><th class="r">Actual</th><th class="r">Var.</th>'.repeat(D.table_months.length + 1)}<th class="r bl">Done</th></tr></thead><tbody>`;
  const tot = D.table_months.map(() => [0, 0]), all = [0, 0];
  const cells = arr => arr.map(([b, a]) => `<td class="r bl">${money(b)}</td><td class="r">${money(a)}</td><td class="r" style="color:${b - a < 0 ? 'var(--bad)' : 'var(--good)'}">${signed(b - a)}</td>`).join('');
  for (const p of D.properties) {
    const arr = p.months.map(m => [m.budget, m.actual]);
    const s = arr.reduce((a, x) => [a[0] + x[0], a[1] + x[1]], [0, 0]);
    arr.forEach((x, i) => { tot[i][0] += x[0]; tot[i][1] += x[1]; }); all[0] += s[0]; all[1] += s[1];
    h += `<tr><td><b>${esc(p.code)}</b></td>${cells([...arr, s])}<td class="r bl" style="font-weight:600;color:${colorPct(p.done)}">${pct(p.done)}</td></tr>`;
  }
  h += `<tr style="font-weight:700;border-top:2px solid #d1d5db"><td>All properties</td>${cells([...tot, all])}<td class="bl"></td></tr></tbody></table></div>
  <p class="foot">Posted to AppFolio on GL 52003 R&amp;M - Grounds (Accrual): team labor (QBT), vendor bills and Ramp, not CapEx. Done = G - melds completed over those due in these months (Completed 1.0, Scheduled 0.25; canceled not counted). *Month to date, against the month's budget for the days so far. Turns excluded.</p></section>`;
  return h;
}

const chips = () => `<div class="chips">${['All', 'Tri-Cities', 'Spokane', 'Tacoma'].map(c => `<button class="chip" data-city="${c}" aria-pressed="${c === city}">${c}</button>`).join('')}</div>`;

function status() {
  const list = D.statusSeries.filter(inCity);
  const groups = {};
  list.forEach(s => (groups[s.who] = groups[s.who] || []).push(s));
  if (!groups.Unassigned) groups.Unassigned = [];
  const names = Object.keys(groups).sort((a, b) => a === 'Unassigned' ? -1 : b === 'Unassigned' ? 1 : groups[b].length - groups[a].length);
  let h = chips() + `<p class="note">Every active recurring meld whose title starts with "G - ", grouped by whoever is assigned in Property Meld right now. New series show up on the next refresh. ${list.length} series${city === 'All' ? '' : ' in ' + city}.</p>`;
  for (const n of names) {
    const rows = groups[n].sort((a, b) => a.prop.localeCompare(b.prop) || a.title.localeCompare(b.title));
    const un = n === 'Unassigned';
    const counted = rows.filter(r => r.counted !== false);
    const occ = counted.flatMap(r => r.occ.filter(o => o.date <= D.today && o.label !== 'Not scheduled' && o.label !== 'Canceled'));
    const sc = occ.reduce((a, o) => a + (o.label === 'Completed' ? 1 : o.label === 'Scheduled' ? 0.25 : 0), 0);
    const rate = occ.length ? sc / occ.length * 100 : null;
    const props = new Set(rows.map(r => r.prop)).size, nw = rows.filter(r => r.isNew).length;
    const ini = un ? '?' : n.split(' + ').map(p => p.replace(/\(.*\)/, '').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase()).join('+');
    h += `<section class="card person"><div class="ph"><span class="av${un ? ' un' : ''}" aria-hidden="true">${esc(ini)}</span><div style="flex-grow:1"><h3>${esc(n)}</h3><small>${un ? (rows.length ? rows.length + ' series need an owner' : 'No series without an owner') : props + ' properties · ' + rows.length + ' active series' + (nw ? ' · ' + nw + ' new' : '')}</small></div>
    ${!un && !counted.length ? '<span class="note">Vendor-billed placeholders, not counted in completion</span>' : rate == null ? '' : `<span style="font-size:18px;font-weight:700;color:${colorPct(rate)}">${pct(Math.round(rate))}</span>`}</div>`;
    if (!rows.length) { h += `<p class="ok">Every G - series has someone assigned. If one loses its owner it lands here.</p></section>`; continue; }
    h += `<div class="box"><table><thead><tr><th>Property</th><th>Recurring series</th><th>Cadence</th><th style="text-align:center">Oldest</th><th></th><th></th><th style="text-align:center">Most recent</th><th class="r">Done</th></tr></thead><tbody>`;
    for (const r of rows) {
      const pad = Array(Math.max(0, 4 - r.occ.length)).fill(null);
      const pills = [...pad.map(() => `<td style="text-align:center;padding:5px 4px"><span class="pill Notdue">No meld yet</span></td>`),
        ...r.occ.map(o => `<td style="text-align:center;padding:5px 4px"><a class="pill ${cls(o.label)}" href="${PM}${o.meld}/summary/" target="_blank" rel="noopener"><span>${o.label}</span><span>${dLabel(o.date)}</span></a></td>`)].join('');
      h += `<tr><td><b>${esc(r.prop)}</b></td><td class="wrap">${esc(r.title)}${r.isNew ? '<span class="badge">New</span>' : ''}</td><td style="color:#4b5563">${esc(r.cadence)}</td>${pills}<td class="r" style="font-weight:700;color:${colorPct(r.done)}">${r.counted === false ? '<span style="font-weight:400;color:var(--muted)">not counted</span>' : pct(r.done)}</td></tr>`;
    }
    h += `</tbody></table></div></section>`;
  }
  return h;
}

function other() {
  const list = D.otherSeries.filter(inCity).sort((a, b) => a.area.localeCompare(b.area) || a.prop.localeCompare(b.prop) || a.title.localeCompare(b.title));
  return chips() + `<p class="note">Every active recurring meld that does NOT start with "G - ", any area. If a grounds series shows up here, it is missing its prefix. ${list.length} series, ${list.filter(x => x.who === 'Unassigned').length} unassigned.</p>
  <section class="card" style="padding:8px 12px"><div class="box"><table><thead><tr><th>Property</th><th>Recurring series</th><th>Cadence</th><th>Assigned</th><th>Area</th></tr></thead><tbody>
  ${list.map(x => `<tr><td><b>${esc(x.prop)}</b></td><td class="wrap">${esc(x.title)}${x.isNew ? '<span class="badge">New</span>' : ''}</td><td style="color:#4b5563">${esc(x.cadence)}</td><td class="${x.who === 'Unassigned' ? 'red' : ''}">${esc(x.who)}</td><td style="color:#4b5563">${esc(x.area)}</td></tr>`).join('')}
  </tbody></table></div></section>`;
}

let woMonth = null, txFrom = null, txTo = null; const openRows = new Set();
const AF = 'https://mckay.appfolio.com/maintenance/service_requests/';
const tag = s => `<span class="src ${s.replace(/ .*/, '')}">${esc(s)}</span>`;
const person = l => esc(l.who || l.vendor || l.merchant || '');
const detail = l => esc(l.src === 'Labor' ? (l.hours != null ? l.hours + ' h' : '') : l.src === 'Ramp' ? [l.merchant, l.desc || l.memo].filter(Boolean).join(' - ') : l.desc || l.memo || '');
const bar = p => p == null ? '' : `<div class="bw"><div class="bf" style="width:${Math.min(100, p)}%;background:${p > 100 ? 'var(--bad)' : p >= 90 ? '#f59e0b' : 'var(--good)'}"></div></div>`;
const varc = v => `<span style="color:${v > 0 ? 'var(--bad)' : v < 0 ? 'var(--good)' : 'var(--muted)'}">${v > 0 ? '+' : v < 0 ? '-' : ''}$${Math.abs(Math.round(v)).toLocaleString('en-US')}</span>`;

function wo() {
  woMonth = woMonth || D.current_month;
  // Property -> work order group (same title) -> every charge, like the Maintenance Budget v. Actual page.
  const props = {};
  for (const w of (D.woCharges || []).filter(inCity)) {
    const lines = w.lines.filter(l => l.month === woMonth);
    if (!lines.length) continue;
    const p = props[w.prop] = props[w.prop] || { code: w.prop, groups: {} };
    const title = w.title || 'Not linked to a work order';
    const g = p.groups[title] = p.groups[title] || { title, wos: [], lines: [] };
    g.wos.push(w); lines.forEach(l => g.lines.push({ ...l, wo: w }));
  }
  (D.propBudget || []).filter(inCity).forEach(b => { if (b.months[woMonth] && b.months[woMonth].budget && !props[b.code]) props[b.code] = { code: b.code, groups: {} }; });
  const rows = Object.values(props).map(p => {
    const b = ((D.propBudget || []).find(x => x.code === p.code) || { months: {} }).months[woMonth] || {};
    const groups = Object.values(p.groups).map(g => ({ ...g, total: g.lines.reduce((a, l) => a + l.amount, 0) })).sort((a, b) => b.total - a.total);
    const actual = groups.reduce((a, g) => a + g.total, 0);
    return { ...p, groups, actual, budget: b.budget || 0 };
  }).sort((a, b) => b.actual - a.actual);
  const tA = rows.reduce((a, r) => a + r.actual, 0), tB = rows.reduce((a, r) => a + r.budget, 0);
  let h = chips() + `<div class="ctl"><p class="note">Everything charged to GL 52003 R&amp;M - Grounds in AppFolio (Accrual), by property and work order. Click a property, then a work order, to see each charge.${woMonth === D.current_month ? ' Budget is month to date.' : ''}</p>
  <select id="woMonth" aria-label="Month">${D.months.slice().reverse().map(m => `<option value="${m}"${m === woMonth ? ' selected' : ''}>${MON[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}</option>`).join('')}</select></div>
  <section class="card tree"><div class="box"><table><thead><tr><th>Property / work order</th><th class="r">Actual</th><th class="r">Budget</th><th class="r">Variance</th><th class="r" style="width:110px">% Bud</th></tr></thead><tbody>
  <tr class="tot"><td>All properties</td><td class="r">${money(tA)}</td><td class="r bud">${money(tB)}</td><td class="r">${varc(tA - tB)}</td><td>${bar(tB ? tA / tB * 100 : null)}</td></tr>`;
  for (const r of rows) {
    const pk = 'p:' + r.code, po = openRows.has(pk);
    h += `<tr class="l0" data-row="${esc(pk)}"><td><span class="chev${po ? ' open' : ''}">&#9656;</span><b>${esc(r.code)}</b></td><td class="r"><b>${r.actual ? money(r.actual) : '&mdash;'}</b></td><td class="r bud">${r.budget ? money(r.budget) : '&mdash;'}</td><td class="r">${varc(r.actual - r.budget)}</td><td>${bar(r.budget ? r.actual / r.budget * 100 : null)}</td></tr>`;
    if (!po) continue;
    for (const g of r.groups) {
      const gk = pk + '|' + g.title, go = openRows.has(gk), w0 = g.wos[0];
      const n = s => g.lines.filter(l => l.src === s).length;
      const counts = [['Labor', 'labor'], ['Ramp', 'Ramp'], ['Vendor bill', 'bill']].map(([s, lab]) => n(s) ? n(s) + ' ' + lab + (n(s) > 1 && lab === 'bill' ? 's' : '') : '').filter(Boolean).join(' · ');
      const link = w0.srId && w0.woId ? `<a href="${AF}${w0.srId}/work_orders/${w0.woId}" target="_blank" rel="noopener">${esc(g.title)}</a>` : esc(g.title);
      h += `<tr class="l1" data-row="${esc(gk)}"><td><span class="chev${go ? ' open' : ''}">&#9656;</span>${link}${g.wos.length > 1 ? `<span class="badge">&times;${g.wos.length} WOs</span>` : ''}<span class="cnt">${counts}</span></td><td class="r">${money(g.total)}</td><td></td><td></td><td></td></tr>`;
      if (!go) continue;
      const ls = g.lines.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
      h += `<tr class="l2"><td colspan="5"><div class="box"><table class="inner"><thead><tr><th>Date</th><th>Type</th><th>Employee / vendor</th><th>Unit</th><th>Detail</th><th>Work order</th><th>Meld</th><th class="r">Amount</th></tr></thead><tbody>
      ${ls.map(l => `<tr><td>${dLabel(l.date)}</td><td>${tag(l.src)}</td><td>${person(l)}</td><td>${esc(l.unit)}</td><td class="wrap">${detail(l)}</td><td style="color:var(--muted)">${esc(l.wo.wo)}</td><td>${l.wo.meld ? `<a href="${PM}${l.wo.meld}/summary/" target="_blank" rel="noopener">${esc(l.wo.ref)}</a>` : esc(l.wo.ref)}</td><td class="r">${money(l.amount)}</td></tr>`).join('')}
      </tbody></table></div></td></tr>`;
    }
  }
  const list = D.workOrders.filter(inCity);
  return h + `</tbody></table></div></section>
  <h3 style="margin:12px 0 0;font-size:15px">G - work orders, last 30 days</h3><p class="note">G - work orders dated in the last 30 days, newest first. ${list.length} work orders.</p>
  <section class="card" style="padding:8px 12px"><div class="box"><table><thead><tr><th>Date</th><th>Property</th><th>Work order</th><th>Assigned</th><th>Status</th><th>Meld</th></tr></thead><tbody>
  ${list.map(w => `<tr><td style="color:#4b5563">${dLabel(w.date)}</td><td><b>${esc(w.prop)}</b></td><td class="wrap">${esc(w.title)}</td><td>${esc(w.who)}</td><td><span class="pill sm ${cls(w.status)}">${w.status}</span></td><td><a href="${PM}${w.meld}/summary/" target="_blank" rel="noopener">${esc(w.ref)}</a></td></tr>`).join('')}
  </tbody></table></div></section>`;
}

function tx() {
  txFrom = txFrom || D.current_month + '-01'; txTo = txTo || D.today;
  const min = D.months[0] + '-01';
  const list = D.transactions.filter(inCity).filter(t => t.date >= txFrom && t.date <= txTo);
  const by = {}; list.forEach(t => by[t.src] = (by[t.src] || 0) + t.amount);
  const total = list.reduce((a, t) => a + t.amount, 0);
  return chips() + `<div class="ctl"><div><label class="dt">From <input type="date" id="txFrom" value="${txFrom}" min="${min}" max="${D.today}"></label><label class="dt">To <input type="date" id="txTo" value="${txTo}" min="${min}" max="${D.today}"></label></div></div>
  <p class="note">Everything posted to GL 52003 R&amp;M - Grounds (Accrual) between those dates: ${Object.entries(by).map(([k, v]) => k + ' ' + money(v)).join(' · ')} · total ${money(total)} · ${list.length} transactions. Data goes back to ${dLabel(min)}, ${min.slice(0, 4)}.</p>
  <section class="card" style="padding:8px 12px"><div class="box"><table><thead><tr><th>Date</th><th>Property</th><th>Type</th><th>Employee / vendor</th><th>Unit</th><th>Detail</th><th class="r">Amount</th></tr></thead><tbody>
  ${list.map(t => `<tr><td style="color:#4b5563">${t.date ? dLabel(t.date) : ''}</td><td><b>${esc(t.prop)}</b></td><td>${tag(t.src)}</td><td>${person(t)}</td><td>${esc(t.unit)}</td><td class="wrap" style="color:#4b5563">${detail(t)}</td><td class="r">${money(t.amount)}</td></tr>`).join('')}
  </tbody></table></div></section>`;
}

function render() {
  if (!TABS.some(t => t[0] === tab)) tab = 'overview';
  document.getElementById('tabs').innerHTML = TABS.map(([id, l]) => `<button role="tab" data-tab="${id}" aria-selected="${id === tab}">${l}</button>`).join('');
  document.getElementById('crumb').textContent = TABS.find(t => t[0] === tab)[1];
  const v = document.getElementById('view');
  v.style.cssText = 'display:flex;flex-direction:column;gap:' + (tab === 'overview' ? '22px' : '16px');
  v.innerHTML = { overview, status, other, wo, tx }[tab]();
}
window.addEventListener('hashchange', () => { tab = location.hash.slice(1); if (D) render(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; history.replaceState(null, '', '#' + tab); render(); return; }
  const c = e.target.closest('[data-city]'); if (c) { city = c.dataset.city; render(); return; }
  const w = e.target.closest('tr[data-row]'); if (w && !e.target.closest('a')) { const k = w.dataset.row; openRows.has(k) ? openRows.delete(k) : openRows.add(k); render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'woMonth') { woMonth = e.target.value; render(); }
  if (e.target.id === 'txFrom' && e.target.value) { txFrom = e.target.value; render(); }
  if (e.target.id === 'txTo' && e.target.value) { txTo = e.target.value; render(); }
});
fetch('data/grounds-dashboard.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  D = d;
  const g = new Date(d.generated_at);
  document.getElementById('gen').textContent = 'Updated ' + g.toLocaleString('en-US', { timeZone: 'America/Los_Angeles', dateStyle: 'medium', timeStyle: 'short' }) + ' PT · Property Meld + AppFolio (Accrual)';
  render();
}).catch(() => { document.getElementById('gen').textContent = 'Could not load data.'; });
</script>
</body>
</html>
