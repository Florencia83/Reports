name: Update Grounds dashboard (daily)

on:
  schedule:
    - cron: '0 20 * * *'  # every day, 20:00 UTC = 1pm PDT / 12pm PST (self-hosted runner on Florencia's PC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Pull Grounds data (Property Meld + AppFolio)
        env:
          PROPERTYMELD_EMAIL: ${{ secrets.PROPERTYMELD_EMAIL }}
          PROPERTYMELD_PASSWORD: ${{ secrets.PROPERTYMELD_PASSWORD }}
          QBT_TOKEN: ${{ secrets.QBT_TOKEN }}
          RAMP_CLIENT_ID: ${{ secrets.RAMP_CLIENT_ID }}
          RAMP_CLIENT_SECRET: ${{ secrets.RAMP_CLIENT_SECRET }}
          APPFOLIO_CLIENT_ID: ${{ secrets.APPFOLIO_CLIENT_ID }}
          APPFOLIO_CLIENT_SECRET: ${{ secrets.APPFOLIO_CLIENT_SECRET }}
        run: node scripts/update-grounds-dashboard.js

      - name: Commit and push if changed
        run: |
          git config user.name "florencia-reports-bot"
          git config user.email "actions@github.com"
          git add data/grounds-dashboard.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
          } else {
            $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
            git commit -m "Automated Grounds dashboard refresh $today"
            git pull --rebase origin main
            git push
          }
